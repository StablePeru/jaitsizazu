[versions]
# Kotlin 2.4.20-2.4.21 supports Gradle 7.6.3-9.7.0 (kotlinlang.org multiplatform compatibility guide).
kotlin = "2.4.21"
# The latest Compose Multiplatform is compatible with the latest Kotlin.
compose-multiplatform = "1.12.2"
kotlinx-coroutines = "1.11.0"
# Android Gradle Plugin: Kotlin 2.4.21 is tested with AGP 8.13-9.3, and AGP 9.3 needs Gradle 9.5 or newer.
# AGP 9 compiles Kotlin itself, so no module applies org.jetbrains.kotlin.android.
agp = "9.3.3"
androidx-activity = "1.13.0"
# yt-dlp, Python, ffmpeg and QuickJS for Android, as Seal and YTDLnis use them. GPL-3.0.
# engine-android mirrors how this exact version runs yt-dlp: recheck
# YoutubeDlAndroidRuntime whenever it changes.
youtubedl-android = "0.18.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
# Compose libraries, by coordinate. Material 2: Material 3 has no stable
# release for this Compose version yet (only 1.13 betas on Maven Central).
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose-multiplatform" }
# Translated strings (Res.string.*), and the tests that read the rendered screens.
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
youtubedl-android-library = { module = "io.github.junkfood02.youtubedl-android:library", version.ref = "youtubedl-android" }
youtubedl-android-ffmpeg = { module = "io.github.junkfood02.youtubedl-android:ffmpeg", version.ref = "youtubedl-android" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The Compose compiler plugin must use the same version as Kotlin.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Android target for a Kotlin Multiplatform library (core, ui).
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
